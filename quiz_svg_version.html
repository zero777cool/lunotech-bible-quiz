<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Quiz</title>
<style>
  :root { --bg:#14213d; --card:#1f2f55; --accent:#fca311; --ok:#2ecc71; --bad:#e74c3c; --text:#f1f1f1; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; padding:16px;
         background:linear-gradient(#04050d 0%, #0d1434 30%, #1a2050 48%, #0c1124 80%) fixed;
         color:var(--text); font-family:system-ui,Segoe UI,Arial,sans-serif; }
  #scene { position:fixed; top:0; left:0; width:100%; height:48vh; z-index:0; pointer-events:none; }
  .card { position:relative; z-index:1; margin:46vh auto 16px; background:rgba(31,47,85,.93); border-radius:16px;
          padding:28px; width:100%; max-width:560px; box-shadow:0 10px 30px rgba(0,0,0,.5);
          border:1px solid rgba(252,163,17,.35); }
  h1 { margin-top:0; color:var(--accent); }
  .meta { display:flex; justify-content:space-between; font-size:.9rem; opacity:.85; margin-bottom:8px; }
  .bar { height:6px; background:#0d1730; border-radius:3px; overflow:hidden; margin-bottom:20px; }
  .bar > div { height:100%; background:var(--accent); transition:width .3s; }
  .timer > div { background:var(--ok); transition:width 1s linear; }
  .q { font-size:1.25rem; margin:0 0 18px; line-height:1.4; }
  .opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 16px; font-size:1rem;
         color:var(--text); background:#2a3d6b; border:2px solid transparent; border-radius:10px; cursor:pointer; }
  .opt:hover:enabled { border-color:var(--accent); }
  .opt.correct { background:var(--ok); color:#07210f; }
  .opt.wrong { background:var(--bad); }
  .opt:disabled { cursor:default; }
  button.main { margin-top:16px; padding:12px 24px; font-size:1rem; font-weight:600; border:0; border-radius:10px;
                background:var(--accent); color:#14213d; cursor:pointer; }
  .hidden { display:none; }
  .score { font-size:3rem; color:var(--accent); margin:10px 0; }
</style>
</head>

<div class="card">
  <div id="start">
    <h1>📖 Bible Quiz</h1>
    <p>10 random questions. 15 seconds each. How many can you get right?</p>
    <p>Best score: <strong id="best">–</strong></p>
    <button class="main" id="startBtn">Start Quiz</button>
  </div>

  <div id="game" class="hidden">
    <div class="meta"><span id="progress"></span><span id="score"></span></div>
    <div class="bar timer"><div id="timerBar" style="width:100%"></div></div>
    <p class="q" id="question"></p>
    <div id="options"></div>
    <button class="main hidden" id="nextBtn">Next →</button>
  </div>

  <div id="end" class="hidden">
    <h1>Quiz complete!</h1>
    <div class="score" id="finalScore"></div>
    <p id="verdict"></p>
    <button class="main" id="againBtn">Play Again</button>
  </div>
</div>

<script>

// Each entry: [question, [options], index of correct option]
const QUESTIONS = [
  ["Who built the ark?", ["Moses","Noah","Abraham","David"], 1],
  ["What is the first book of the Bible?", ["Exodus","Genesis","Psalms","Matthew"], 1],
  ["How many days did God spend creating the world before resting on the next?", ["Five","Six","Seven","Ten"], 1],
  ["Who was swallowed by a great fish?", ["Jonah","Elijah","Daniel","Peter"], 0],
  ["Who defeated Goliath?", ["Saul","Samuel","David","Jonathan"], 2],
  ["In which town was Jesus born?", ["Nazareth","Jerusalem","Bethlehem","Jericho"], 2],

const TOTAL = 10, TIME = 15;
const $ = id => document.getElementById(id);
let qs, idx, score, timer, left, locked;

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const show = id => ["start","game","end"].forEach(s => $(s).classList.toggle("hidden", s!==id));
const getBest = () => { try { return localStorage.getItem("bibleBest"); } catch { return null; } };
const setBest = v => { try { localStorage.setItem("bibleBest", v); } catch {} };
$("best").textContent = getBest() ?? "–";

function start() {
  qs = shuffle(QUESTIONS).slice(0, TOTAL).map(([q,o,a]) => {
    const opts = shuffle(o.map((t,i)=>({t,c:i===a})));
    return { q, opts };
  });
  idx = 0; score = 0;
  show("game"); render();
}

function render() {
  locked = false;
  const cur = qs[idx];
  $("progress").textContent = `Question ${idx+1} / ${TOTAL}`;
  $("score").textContent = `Score: ${score}`;
  $("question").textContent = cur.q;
  $("nextBtn").classList.add("hidden");
  const box = $("options"); box.innerHTML = "";
  cur.opts.forEach((o,i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o.t;
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
  left = TIME; tick(true);
  clearInterval(timer);
  timer = setInterval(() => { left--; tick(); if (left<=0) answer(-1); }, 1000);
}

function tick(reset) {
  const bar = $("timerBar");
  if (reset) { bar.style.transition="none"; bar.style.width="100%"; bar.offsetWidth; bar.style.transition=""; }
  bar.style.width = (left/TIME*100) + "%";
  bar.style.background = left<=5 ? "var(--bad)" : "";
}

function answer(i) {
  if (locked) return;
  locked = true; clearInterval(timer);
  const cur = qs[idx];
  [...$("options").children].forEach((b,n) => {
    b.disabled = true;
    if (cur.opts[n].c) b.classList.add("correct");
    else if (n===i) b.classList.add("wrong");
  });
  if (i>=0 && cur.opts[i].c) score++;
  $("score").textContent = `Score: ${score}`;
  const nb = $("nextBtn");
  nb.textContent = idx===TOTAL-1 ? "See Results" : "Next →";
  nb.classList.remove("hidden");
  nb.focus();
}

function next() {
  if (++idx < TOTAL) return render();
  const best = Number(getBest() ?? -1);
  if (score > best) setBest(score);
  $("best").textContent = Math.max(score, best);
  $("finalScore").textContent = `${score} / ${TOTAL}`;
  $("verdict").textContent = score>=9 ? "Outstanding! 🏆" : score>=7 ? "Great job! 🎉" : score>=5 ? "Not bad – keep going! 👍" : "Keep studying the Word! 📚";
  show("end");
}

$("startBtn").onclick = start;
$("againBtn").onclick = start;
$("nextBtn").onclick = next;
document.addEventListener("keydown", e => {
  if ($("game").classList.contains("hidden")) return;
  if (!locked && "1234".includes(e.key) && e.key) answer(Number(e.key)-1);
});
</script>
